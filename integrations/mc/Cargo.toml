[workspace]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["MissionControl Engineers <support@missioncontrol.ai>"]
license = "Apache-2.0"

[package]
name = "mc"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust-native MCP bridge for Mission Control"
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.34", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rumqttc = "0.18"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.4"
urlencoding = "2.1"
futures-util = "0.3"
axum = { version = "0.8", features = ["macros"] }
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
hyper = "1.8.1"
wasmtime = "16"
wat = "1.0"
dirs = "4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
open = "5"
base64 = "0.22"
tar = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
portable-pty = "0.8"
which = "6"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
mc-mesh-packs = { path = "../mc-mesh/crates/mc-mesh-packs" }
mc-mesh-receipts = { path = "../mc-mesh/crates/mc-mesh-receipts" }
mc-mesh-sync = { path = "../mc-mesh/crates/mc-mesh-sync" }
mc-mesh-secrets = { path = "../mc-mesh/crates/mc-mesh-secrets" }
ratatui = "0.29"
crossterm = "0.28"
async-trait = "0.1"

[dev-dependencies]
httpmock = "0.6"
wasmtime = "16"
wat = "1.0"
tempfile = "3.9"
wiremock = "0.6"
