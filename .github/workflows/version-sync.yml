name: version-sync

on:
  pull_request:
    paths:
      - VERSION
      - "crates/edgeplane/Cargo.toml"
      - "crates/edgeplaned/Cargo.toml"
      - "crates/edgeplane-tower/Cargo.toml"
      - ".github/workflows/version-sync.yml"
  push:
    branches: [main]

jobs:
  check-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert VERSION matches all three workspaces
        shell: bash
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < VERSION)
          if [ -z "$expected" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          fail=0
          for crate in edgeplane edgeplaned edgeplane-tower; do
            toml="crates/$crate/Cargo.toml"
            # Extract the version line under [workspace.package]. awk prints
            # the value between the first pair of double quotes on the first
            # "version =" line after the [workspace.package] header.
            actual=$(awk '
              /^\[workspace\.package\]/ { in_section = 1; next }
              /^\[/ && in_section { in_section = 0 }
              in_section && /^version[[:space:]]*=/ {
                match($0, /"[^"]+"/)
                print substr($0, RSTART+1, RLENGTH-2)
                exit
              }
            ' "$toml")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$toml workspace.package version is '$actual', expected '$expected' (from /VERSION)"
              fail=1
            else
              echo "ok: $crate = $actual"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Run: ./scripts/set-version.sh $expected"
            echo "to sync all three workspaces to /VERSION."
            exit 1
          fi
