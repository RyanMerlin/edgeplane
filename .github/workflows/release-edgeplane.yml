name: Release edgeplane

# What ships by default on a tag push (5 builds + publish = 6 jobs):
#   edgeplane-linux-x86_64        — CLI for x86 Linux nodes (most common)
#   edgeplane-linux-aarch64       — CLI for ARM Linux (Pi, ARM cloud)
#   edgeplane-macos-aarch64       — CLI for Apple Silicon dev machines
#   edgeplaned-linux-x86_64   — node daemon, the per-host service that
#                            supervises agents (every end-user needs this
#                            to run agents)
#   edgeplaned-linux-aarch64  — node daemon for ARM Linux nodes
#
# `edgeplane-tower` is NOT in this matrix — it ships as a Docker image
# via `build-image.yml`; end users don't install it locally.
#
# Extras (macOS x86_64, Windows edgeplane, etc.) are gated behind
# `workflow_dispatch` with `include_extras=true`. They run with
# `continue-on-error: true` and the release does NOT wait on them, so
# a Windows toolchain hiccup never blocks the core publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_extras:
        description: 'Also build macOS x86_64, Windows, and other rarely-used targets'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # edgeplane CLI — covers nodes and dev machines.
          - bin: edgeplane
            crate_path: crates/edgeplane
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: edgeplane-linux-x86_64
            use_cross: false
            features: ''
          - bin: edgeplane
            crate_path: crates/edgeplane
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: edgeplane-linux-aarch64
            use_cross: true
            features: ''
          - bin: edgeplane
            crate_path: crates/edgeplane
            target: aarch64-apple-darwin
            os: macos-latest
            artifact: edgeplane-macos-aarch64
            use_cross: false
            features: ''

          # edgeplaned — per-node daemon, ships alongside the CLI.
          - bin: edgeplaned
            crate_path: crates/edgeplaned
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: edgeplaned-linux-x86_64
            use_cross: false
            features: ''
          - bin: edgeplaned
            crate_path: crates/edgeplaned
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: edgeplaned-linux-aarch64
            use_cross: true
            features: ''

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285  # v2.79.13
        with:
          tool: cross

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}-${{ matrix.bin }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release ${{ matrix.features }} --target ${{ matrix.target }} --package ${{ matrix.bin }}

      - name: Build (native)
        if: '!matrix.use_cross'
        run: cargo build --release ${{ matrix.features }} --target ${{ matrix.target }} --package ${{ matrix.bin }}

      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # Optional targets — only run on `workflow_dispatch` with include_extras=true.
  # Failures here do NOT block the release.
  build-extras:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'workflow_dispatch' && inputs.include_extras
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: edgeplane
            crate_path: crates/edgeplane
            target: x86_64-apple-darwin
            os: macos-latest
            artifact: edgeplane-macos-x86_64
            features: ''
          - bin: edgeplane
            crate_path: crates/edgeplane
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: edgeplane-windows-x86_64.exe
            features: ''

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}-${{ matrix.bin }}

      - name: Build
        run: cargo build --release ${{ matrix.features }} --target ${{ matrix.target }} --package ${{ matrix.bin }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\${{ matrix.bin }}.exe ${{ matrix.artifact }}
        shell: cmd

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build, build-extras]
    # Run when `build` succeeds. Tolerate `build-extras` being skipped (tag
    # pushes don't request extras) or failing (extras are `continue-on-error`
    # by design — a Windows toolchain hiccup must never block the core publish).
    # `always()` is required to override GitHub's default "skip when any need is
    # skipped" — without it, every tag-push release would be auto-skipped because
    # extras only run on workflow_dispatch.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.build-extras.result == 'success' ||
       needs.build-extras.result == 'skipped' ||
       needs.build-extras.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        working-directory: artifacts
        run: |
          sha256sum $(ls) > checksums.txt
          cat checksums.txt

      # Self-update manifest consumed by `edgeplane update`, which fetches
      # `…/releases/latest/download/latest.json`. GitHub redirects that to the
      # latest tag, so this asset must exist on every release or the self-update
      # 404s. Lists every distributable binary (`edgeplane` + `edgeplaned`) with
      # a `bin` discriminator: `edgeplane update` converges the running CLI plus
      # any sibling binary already installed next to it (e.g. `edgeplaned` on a
      # node). The `bin` field removes the old os/arch-only ambiguity, so the
      # daemon can safely be listed. Pre-0.14.1 CLIs ignore the unknown `bin`
      # field and, because entries are emitted sorted, still match `edgeplane-*`
      # before `edgeplaned-*` — so they keep self-updating the CLI correctly.
      - name: Generate latest.json (self-update manifest)
        working-directory: artifacts
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # bin token is the binary name; os/arch tokens must match Rust's env::consts::{OS,ARCH}.
          pat = re.compile(r"^(edgeplane|edgeplaned)-(linux|macos)-(x86_64|aarch64)$")
          sums = {}
          with open("checksums.txt") as f:
              for line in f:
                  parts = line.split()
                  if len(parts) == 2:
                      sums[parts[1]] = parts[0]
          files = []
          for name, sha in sorted(sums.items()):
              m = pat.match(name)
              if m:
                  files.append({"bin": m.group(1), "os": m.group(2), "arch": m.group(3),
                                "url": f"{base}/{name}", "sha256": sha})
          if not files:
              raise SystemExit("no edgeplane artifacts matched; refusing to publish empty manifest")
          manifest = {"version": tag, "files": files}
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          files: artifacts/*
          generate_release_notes: true
