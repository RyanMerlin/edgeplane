[package]
name = "edgeplane-tower"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Edgeplane server node — HTTP API + distributed task coordination"
license.workspace = true

[[bin]]
name = "edgeplane-tower"
path = "src/main.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[lib]
name = "edgeplane_tower"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1.34", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
edgeplaned-paths = { path = "../edgeplaned-paths" }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
flate2 = "1.0"
tar = "0.4"
tokio-stream = "0.1"
futures-util = "0.3"
tempfile = "3.9"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
rust-s3 = { version = "0.35", default-features = false, features = ["with-tokio", "tokio-rustls-tls", "fail-on-err"] }
utoipa = { version = "5", features = ["chrono"] }

[dev-dependencies]
axum-test = "20"
wiremock = "0.6"
