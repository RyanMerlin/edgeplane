services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: edgeplane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgeplane}
      POSTGRES_USER: ${POSTGRES_USER:-edgeplane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - edgeplane-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgeplane} -d ${POSTGRES_DB:-edgeplane} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0

  rustfs:
    image: rustfs/rustfs:latest
    container_name: edgeplane-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${EP_OBJECT_STORAGE_ACCESS_KEY:?set EP_OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${EP_OBJECT_STORAGE_ACCESS_SECRET:?set EP_OBJECT_STORAGE_ACCESS_SECRET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - edgeplane-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/health/live || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"403\" ]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5

  rustfs-init:
    build:
      context: .
      dockerfile: crates/edgeplane-tower/Dockerfile
    container_name: edgeplane-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      EP_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      EP_OBJECT_STORAGE_REGION: ${EP_OBJECT_STORAGE_REGION:-us-east-1}
      EP_OBJECT_STORAGE_BUCKET: ${EP_OBJECT_STORAGE_BUCKET:-edgeplane}
      EP_OBJECT_STORAGE_ACCESS_KEY: ${EP_OBJECT_STORAGE_ACCESS_KEY:?set EP_OBJECT_STORAGE_ACCESS_KEY}
      EP_OBJECT_STORAGE_ACCESS_SECRET: ${EP_OBJECT_STORAGE_ACCESS_SECRET:?set EP_OBJECT_STORAGE_ACCESS_SECRET}
    entrypoint: ["edgeplane-tower", "bucket-init"]
    restart: "no"

  opencode:
    # AI coding agent — drives inference for the AI Console runtime layer.
    # Runs opencode in HTTP server mode; OpencodeAdapter connects to it at
    # EP_OPENCODE_URL (default: http://opencode:4096).
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.2.26}
    container_name: edgeplane-opencode
    profiles:
      - opencode
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-edgeplane}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Inject config without needing a persistent config file.
      # OPENCODE_MODEL overrides the active model; OPENCODE_PROVIDER_* sets provider options.
      # For a custom OpenAI-compatible endpoint set OPENAI_API_BASE and OPENCODE_MODEL.
      OPENCODE_CONFIG_CONTENT: ${OPENCODE_CONFIG_CONTENT:-}
    ports:
      - "4096:4096"
    volumes:
      - edgeplane-opencode-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4096/global/health 2>/dev/null | grep -q '\"healthy\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  api:
    build:
      context: .
      dockerfile: crates/edgeplane-tower/Dockerfile
    container_name: edgeplane-api
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-edgeplane}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edgeplane}
      EP_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      EP_OBJECT_STORAGE_REGION: us-east-1
      EP_OBJECT_STORAGE_BUCKET: ${EP_OBJECT_STORAGE_BUCKET:-edgeplane}
      EP_OBJECT_STORAGE_SECURE: "false"
      EP_OBJECT_STORAGE_ACCESS_KEY: ${EP_OBJECT_STORAGE_ACCESS_KEY}
      EP_OBJECT_STORAGE_ACCESS_SECRET: ${EP_OBJECT_STORAGE_ACCESS_SECRET}
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    mem_limit: 2g
    cpus: 2.0

  mcpd:
    build:
      context: .
      dockerfile: crates/edgeplane/Dockerfile
    container_name: edgeplane-mcpd
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      EP_MCP_MODE: daemon
      EP_BASE_URL: http://api:8008
      EP_DAEMON_HOST: 0.0.0.0
      EP_DAEMON_PORT: "8765"
      EP_TOKEN: ${EP_TOKEN:-}
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

volumes:
  edgeplane-postgres-data:
  edgeplane-rustfs-data:
  edgeplane-opencode-workspace:
