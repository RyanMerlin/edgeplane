[workspace]
resolver = "2"
members = [
    "crates/edgeplaned-paths",
    "crates/edgeplane",
    "crates/edgeplane-tower",
    "crates/edgeplane-zrpc-proto",
    "crates/edgeplaned/crates/edgeplaned-bin",
    "crates/edgeplaned/crates/edgeplaned-acp",
    "crates/edgeplaned/crates/edgeplaned-core",
    "crates/edgeplaned/crates/edgeplaned-packs",
    "crates/edgeplaned/crates/edgeplaned-receipts",
    "crates/edgeplaned/crates/edgeplaned-runtimes",
    "crates/edgeplaned/crates/edgeplaned-sandbox",
    "crates/edgeplaned/crates/edgeplaned-secrets",
    "crates/edgeplaned/crates/edgeplaned-sync",
    "crates/edgeplaned/crates/edgeplaned-work",
]
# Built only for wasm32-wasip1 (own .cargo/config.toml + lockfile); not part of
# the host workspace build. Depends on edgeplane-zrpc-proto via path.
exclude = ["crates/edgeplane-zrpc"]

[workspace.package]
version = "0.16.2"
edition = "2024"
authors = ["Edgeplane Engineers <support@edgeplane.ai>"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
dirs = "4"
serde_yaml = "0.9"
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
rusqlite = { version = "0.31", features = ["bundled"] }
which = "6"

# Dev build size: dependencies carry no debuginfo (you never step into them), which
# keeps target/debug/deps small; first-party crates keep line-level info for backtraces.
# Added 2026-06-17 alongside sccache + cargo-sweep to bound shared /workspace/cargo-target.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
