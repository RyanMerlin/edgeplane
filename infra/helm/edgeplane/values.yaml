nameOverride: ""
replicaCount: 2

image:
  # Override with your registry/repository when deploying.
  # Example: ghcr.io/<your-org>/edgeplane
  repository: ghcr.io/your-org/edgeplane
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

config:
  EP_BASE_URL: https://edgeplane.internal
  POSTGRES_HOST: placeholder-postgres
  POSTGRES_USER: ep_admin
  EP_OBJECT_STORAGE_ENDPOINT: http://minio.edgeplane.svc.cluster.local
  EP_OBJECT_STORAGE_BUCKET: edgeplane

# SECURITY: These values MUST be overridden in production via a K8s Secret.
# The secret.yaml template renders these into an Opaque Secret — never put
# real credentials in values.yaml or pass them as plain --set flags.
# Better: reference an external secret (Infisical, ESO, Vault).
# Note: EP_TOKEN has been removed — auth uses OIDC + node JWT.
secrets:
  POSTGRES_PASSWORD: ""  # REQUIRED — set per deployment
  EP_OBJECT_STORAGE_ACCESS_KEY: ""  # REQUIRED — set per deployment
  EP_OBJECT_STORAGE_ACCESS_SECRET: ""  # REQUIRED — set per deployment

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
