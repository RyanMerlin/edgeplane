name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_compat_smoke:
        description: "Run compatibility smoke matrix"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285  # v2.79.13
        with:
          tool: nextest
      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Test edgeplane-tower
        run: cargo nextest run --manifest-path crates/edgeplane-tower/Cargo.toml --test test_health --test test_routes --test test_proxy --test test_work
      - name: Test edgeplane
        run: cargo nextest run --manifest-path crates/edgeplane/Cargo.toml --test-threads 1
      - name: Test edgeplaned
        run: cargo nextest run --workspace --exclude edgeplane --exclude edgeplane-tower

  launch-regression:
    name: Launch regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-launch-regression-${{ hashFiles('crates/edgeplane/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-launch-regression-
      - name: Run edgeplane launch regression harness
        run: bash scripts/launch-regression.sh

  compat-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_compat_smoke == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Run staged compatibility smoke matrix
        run: |
          cd crates/edgeplane
          cargo run -- system compat matrix run --providers claude,codex --mode smoke

  compat-strict-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Check whether edgeplane integration changed
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4
        with:
          filters: |
            edgeplane:
              - 'crates/edgeplane/**'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.edgeplane == 'true'
      - name: Main branch strict compatibility gate
        if: steps.changes.outputs.edgeplane == 'true'
        run: |
          cd crates/edgeplane
          mkdir -p .ci-bin
          cat > .ci-bin/claude <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat > .ci-bin/codex <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x .ci-bin/claude .ci-bin/codex
          export PATH="$PWD/.ci-bin:$PATH"
          cargo run -- system compat matrix run --providers claude,codex --mode smoke > /tmp/compat-latest.json
          jq -e '.summary.overall_status == "compatible"' /tmp/compat-latest.json >/dev/null
      - name: Compatibility gate skipped
        if: steps.changes.outputs.edgeplane != 'true'
        run: echo "No crates/edgeplane changes detected; skipping strict compatibility gate."

  docs-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate-doc-catalog.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Stage audit config
        run: cp audit.toml "${CARGO_HOME:-$HOME/.cargo}/audit.toml"
      - name: Security audit
        run: cargo audit
