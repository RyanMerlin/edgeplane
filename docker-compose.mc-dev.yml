# mc-controlplane local dev stack — Postgres + mc-controlplane
#
# Usage:
#   docker compose -f docker-compose.mc-dev.yml up --build
#
# Ports:
#   8009 — mc-controlplane API
#   5432 — Postgres (exposed for psql / pgAdmin)
#
# Quick test:
#   curl http://localhost:8009/health

services:
  postgres:
    image: postgres:16-alpine
    container_name: missioncontrol-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: missioncontrol
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: missioncontrol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  mc-controlplane:
    build:
      context: .
      dockerfile: integrations/mc-controlplane/Dockerfile
    container_name: missioncontrol-mc-controlplane-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://missioncontrol:missioncontrol@postgres:5432/missioncontrol
      MC_BIND: 0.0.0.0:8009
      MC_TOKEN: dev-token
      RUST_LOG: mc_controlplane=debug,info
    ports:
      - "8009:8009"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8009/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
