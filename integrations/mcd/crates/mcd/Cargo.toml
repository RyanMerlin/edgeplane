[package]
name = "mcd"
version.workspace = true
edition = "2024"
description = "mcd daemon — work-first agent coordination for MissionControl"
license = "Apache-2.0"

[[bin]]
name = "mcd"
path = "src/main.rs"

[dependencies]
mcd-acp = { path = "../mcd-acp" }
mcd-core = { path = "../mcd-core" }
mcd-secrets = { path = "../mcd-secrets" }
mcd-packs = { path = "../mcd-packs" }
mcd-receipts = { path = "../mcd-receipts" }
mcd-work = { path = "../mcd-work" }
mcd-runtimes = { path = "../mcd-runtimes" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
rusqlite = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
http = "1"
reqwest = { workspace = true }
fs2 = "0.4"
nix = { version = "0.29", features = ["signal"] }
which = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3.9"
