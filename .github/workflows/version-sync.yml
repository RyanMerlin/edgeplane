name: version-sync

on:
  pull_request:
    paths:
      - VERSION
      - "Cargo.toml"
      - ".github/workflows/version-sync.yml"
  push:
    branches: [main]

jobs:
  check-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert VERSION matches workspace.package version
        shell: bash
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]' < VERSION)
          if [ -z "$expected" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          # All workspace members use version.workspace = true.
          # The single source of truth is [workspace.package] in the root Cargo.toml.
          actual=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ && in_section { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' Cargo.toml)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Cargo.toml [workspace.package] version is '$actual', expected '$expected' (from /VERSION)"
            echo ""
            echo "Run: ./scripts/set-version.sh $expected"
            echo "to sync the workspace version to /VERSION."
            exit 1
          fi
          echo "ok: workspace version = $actual"
