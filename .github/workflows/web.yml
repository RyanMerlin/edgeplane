name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-ci:
    name: Web build + drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (node24 runtime, verified live)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web2/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-web-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-ci-

      # Gate 1: OpenAPI drift — regen from Rust types, fail if committed spec is stale
      - name: Generate OpenAPI spec (DB-free)
        run: cargo run -p edgeplane-tower --bin gen-openapi --quiet > /tmp/openapi.json

      - name: OpenAPI drift gate
        run: git diff --no-index --exit-code /tmp/openapi.json web2/openapi.json

      # Gate 2: TS codegen drift — regen types from spec, fail if committed types are stale
      - name: Install web dependencies
        run: npm ci
        working-directory: web2

      - name: Regenerate TypeScript types from OpenAPI spec
        run: npm run gen:api
        working-directory: web2

      - name: TS codegen drift gate
        run: git diff --exit-code src/api/schema.gen.ts
        working-directory: web2

      # Build + lint + test
      - name: Lint
        run: npm run lint
        working-directory: web2

      - name: Test
        run: npm test
        working-directory: web2

      - name: Build
        run: npm run build
        working-directory: web2
