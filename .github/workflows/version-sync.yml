name: version-sync

on:
  pull_request:
    paths:
      - VERSION
      - "integrations/mc/Cargo.toml"
      - "integrations/mcd/Cargo.toml"
      - "integrations/mc-controlplane/Cargo.toml"
      - ".github/workflows/version-sync.yml"
  push:
    branches: [main]

jobs:
  check-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert VERSION matches all three workspaces
        run: |
          set -euo pipefail
          expected=$(cat VERSION | tr -d '[:space:]')
          if [[ -z "$expected" ]]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          fail=0
          for crate in mc mcd mc-controlplane; do
            toml="integrations/$crate/Cargo.toml"
            actual=$(python3 -c "
import re, sys
text = open('$toml').read()
m = re.search(r'\[workspace\.package\][^\[]*?\nversion\s*=\s*\"([^\"]+)\"', text, re.DOTALL)
print(m.group(1) if m else '')
")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$toml workspace.package version is '$actual', expected '$expected' (from /VERSION)"
              fail=1
            else
              echo "ok: $crate = $actual"
            fi
          done
          if [[ $fail -ne 0 ]]; then
            echo ""
            echo "Run: ./scripts/set-version.sh $expected"
            echo "to sync all three workspaces to /VERSION."
            exit 1
          fi
