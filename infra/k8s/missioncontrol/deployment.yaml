apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeplane-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgeplane-api
  template:
    metadata:
      labels:
        app: edgeplane-api
    spec:
      containers:
        - name: edgeplane
          image: ghcr.io/ryanmerlin/edgeplane:latest
          envFrom:
            - configMapRef:
                name: edgeplane-config
          ports:
            - containerPort: 8008
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8008
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8008
