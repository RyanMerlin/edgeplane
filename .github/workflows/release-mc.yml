name: Release mc

# What ships by default on a tag push (5 builds + publish = 6 jobs):
#   mc-linux-x86_64        — CLI for x86 Linux nodes (most common)
#   mc-linux-aarch64       — CLI for ARM Linux (Pi, ARM cloud)
#   mc-macos-aarch64       — CLI for Apple Silicon dev machines
#   mc-mesh-linux-x86_64   — node daemon, the per-host service that
#                            supervises agents (every end-user needs this
#                            to run agents)
#   mc-mesh-linux-aarch64  — node daemon for ARM Linux nodes
#
# `mc-controlplane` is NOT in this matrix — it ships as a Docker image
# via `build-image.yml`; end users don't install it locally.
#
# Extras (macOS x86_64, Windows mc, etc.) are gated behind
# `workflow_dispatch` with `include_extras=true`. They run with
# `continue-on-error: true` and the release does NOT wait on them, so
# a Windows toolchain hiccup never blocks the core publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_extras:
        description: 'Also build macOS x86_64, Windows, and other rarely-used targets'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mc CLI — covers nodes and dev machines.
          - bin: mc
            crate_path: integrations/mc
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mc-linux-x86_64
            use_cross: false
            features: '--features tui'
          - bin: mc
            crate_path: integrations/mc
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mc-linux-aarch64
            use_cross: true
            features: '--features tui'
          - bin: mc
            crate_path: integrations/mc
            target: aarch64-apple-darwin
            os: macos-latest
            artifact: mc-macos-aarch64
            use_cross: false
            features: '--features tui'

          # mc-mesh — per-node daemon, ships alongside the CLI.
          - bin: mc-mesh
            crate_path: integrations/mc-mesh
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mc-mesh-linux-x86_64
            use_cross: false
            features: ''
          - bin: mc-mesh
            crate_path: integrations/mc-mesh
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mc-mesh-linux-aarch64
            use_cross: true
            features: ''

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.bin }}-cargo-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate_path)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.bin }}-cargo-

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release ${{ matrix.features }} --target ${{ matrix.target }} --manifest-path ${{ matrix.crate_path }}/Cargo.toml

      - name: Build (native)
        if: '!matrix.use_cross'
        working-directory: ${{ matrix.crate_path }}
        run: cargo build --release ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Rename artifact
        run: |
          BIN=$(find ${{ matrix.crate_path }}/target/${{ matrix.target }}/release target/${{ matrix.target }}/release -maxdepth 1 -name ${{ matrix.bin }} -type f 2>/dev/null | head -1)
          cp "$BIN" ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # Optional targets — only run on `workflow_dispatch` with include_extras=true.
  # Failures here do NOT block the release.
  build-extras:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'workflow_dispatch' && inputs.include_extras
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: mc
            crate_path: integrations/mc
            target: x86_64-apple-darwin
            os: macos-latest
            artifact: mc-macos-x86_64
            features: '--features tui'
          - bin: mc
            crate_path: integrations/mc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mc-windows-x86_64.exe
            features: '--features tui'

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.bin }}-cargo-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate_path)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.bin }}-cargo-

      - name: Build
        working-directory: ${{ matrix.crate_path }}
        run: cargo build --release ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=$(find ${{ matrix.crate_path }}/target/${{ matrix.target }}/release target/${{ matrix.target }}/release -maxdepth 1 -name ${{ matrix.bin }} -type f 2>/dev/null | head -1)
          cp "$BIN" ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy ${{ matrix.crate_path }}\target\${{ matrix.target }}\release\${{ matrix.bin }}.exe ${{ matrix.artifact }}
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        working-directory: artifacts
        run: |
          sha256sum $(ls) > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
