name: Release mc

# Tags publish a Linux x86_64 `mc` binary by default — that's what the
# homelab actually consumes. The expanded matrix (macOS, aarch64,
# Windows, mc-mesh, mc-controlplane) is gated behind `workflow_dispatch`
# so it never runs unless someone clicks the button. mc-controlplane
# ships as a Docker image via `build-image.yml`; releasing a raw binary
# duplicates the work for no consumer today.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_extras:
        description: 'Also build macOS, Windows, aarch64, mc-mesh, mc-controlplane'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-mc:
    name: Build mc-linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-mc-cargo-${{ hashFiles('integrations/mc/Cargo.lock') }}
          restore-keys: ubuntu-mc-cargo-

      - name: Build
        working-directory: integrations/mc
        run: cargo build --release --features tui --target x86_64-unknown-linux-gnu

      - name: Rename artifact
        run: |
          BIN=$(find integrations/mc/target/x86_64-unknown-linux-gnu/release -maxdepth 1 -name mc -type f | head -1)
          cp "$BIN" mc-linux-x86_64
          chmod +x mc-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: mc-linux-x86_64
          path: mc-linux-x86_64
          retention-days: 1

  # Optional extras — only run on manual dispatch with include_extras=true.
  # If any of these fail, the release still publishes the core mc binary
  # because `release` depends only on `build-mc`.
  build-extras:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'workflow_dispatch' && inputs.include_extras
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mc-linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mc-macos-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mc-macos-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mc-windows-x86_64.exe
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-mc-cargo-${{ hashFiles('integrations/mc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-mc-cargo-

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --features tui --target ${{ matrix.target }} --manifest-path integrations/mc/Cargo.toml

      - name: Build (native)
        if: '!matrix.use_cross'
        working-directory: integrations/mc
        run: cargo build --release --features tui --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=$(find integrations/mc/target/${{ matrix.target }}/release target/${{ matrix.target }}/release -maxdepth 1 -name mc -type f 2>/dev/null | head -1)
          cp "$BIN" ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy integrations\mc\target\${{ matrix.target }}\release\mc.exe ${{ matrix.artifact }}
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build-mc]
    if: always() && needs.build-mc.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        working-directory: artifacts
        run: |
          sha256sum $(ls) > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
