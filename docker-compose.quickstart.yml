services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: missioncontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: missioncontrol
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: missioncontrol
    volumes:
      - missioncontrol-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol -d missioncontrol || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  rustfs:
    image: rustfs/rustfs:latest
    container_name: missioncontrol-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: missioncontrol
      RUSTFS_SECRET_KEY: missioncontrol-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - missioncontrol-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/health/live || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"403\" ]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  rustfs-init:
    image: python:3.11-slim
    container_name: missioncontrol-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      MC_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      MC_OBJECT_STORAGE_REGION: us-east-1
      MC_OBJECT_STORAGE_ACCESS_KEY: missioncontrol
      MC_OBJECT_STORAGE_ACCESS_SECRET: missioncontrol-secret
      MC_OBJECT_STORAGE_BUCKET: missioncontrol
      MC_OBJECT_STORAGE_SECURE: "false"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        pip install --no-cache-dir boto3 >/tmp/rustfs-init-pip.log
        python - <<'PY'
        import os, boto3
        from botocore.exceptions import ClientError
        c = boto3.client("s3",
            endpoint_url=os.environ["MC_OBJECT_STORAGE_ENDPOINT"],
            aws_access_key_id=os.environ["MC_OBJECT_STORAGE_ACCESS_KEY"],
            aws_secret_access_key=os.environ["MC_OBJECT_STORAGE_ACCESS_SECRET"],
            region_name=os.environ["MC_OBJECT_STORAGE_REGION"])
        bucket = os.environ["MC_OBJECT_STORAGE_BUCKET"]
        try:
            c.head_bucket(Bucket=bucket)
            print(f"bucket exists: {bucket}")
        except ClientError as e:
            if e.response["Error"]["Code"] in ("404", "NoSuchBucket", "NotFound"):
                c.create_bucket(Bucket=bucket)
                print(f"bucket created: {bucket}")
            else:
                raise
        PY
    restart: "no"

  api:
    build:
      context: .
      dockerfile: integrations/mc-controlplane/Dockerfile
    container_name: missioncontrol-api
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://missioncontrol:missioncontrol@postgres:5432/missioncontrol
      MC_TOKEN: ${MC_TOKEN:-}
      MC_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      MC_OBJECT_STORAGE_REGION: us-east-1
      MC_OBJECT_STORAGE_BUCKET: missioncontrol
      MC_OBJECT_STORAGE_SECURE: "false"
      MC_OBJECT_STORAGE_ACCESS_KEY: missioncontrol
      MC_OBJECT_STORAGE_ACCESS_SECRET: missioncontrol-secret
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    mem_limit: 1g
    cpus: 1.5

  mcpd:
    build:
      context: .
      dockerfile: integrations/mc/Dockerfile
    container_name: missioncontrol-mcpd
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MC_MCP_MODE: daemon
      MC_BASE_URL: http://api:8008
      MC_DAEMON_HOST: 0.0.0.0
      MC_DAEMON_PORT: "8765"
      MC_TOKEN: ${MC_TOKEN:-}
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 256m
    cpus: 1.0

volumes:
  missioncontrol-postgres-data:
  missioncontrol-rustfs-data:
