# Mirrors RyanMerlin/missioncontrol → missioncontrol-ai/missioncontrol
# Auth: GitHub App "merlinlabs-automation" (App ID 3676358), bypass on target ruleset.
name: Mirror to missioncontrol-ai

# Trigger scope:
# - `main` pushes only. Feature branches do NOT mirror on every push —
#   they used to (`branches: ["**"]`) and that produced one mirror run
#   per push, most of which failed when the App token's ruleset bypass
#   didn't cover a new branch. The mirror finishes when feature branches
#   are merged to main.
# - Tag pushes mirror via `git push --mirror` automatically on the next
#   main push, OR run `workflow_dispatch` if you need the tag mirrored
#   immediately.
# - `create`/`delete` removed for the same reason — they double-fired
#   with `push` and added noise.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint GitHub App token for missioncontrol-ai
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MERLINLABS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.MERLINLABS_AUTOMATION_PRIVATE_KEY }}
          owner: missioncontrol-ai

      - name: Push mirror to missioncontrol-ai
        run: |
          git remote add mirror https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/missioncontrol-ai/missioncontrol.git
          git push mirror --mirror
