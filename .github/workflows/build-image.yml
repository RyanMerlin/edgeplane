name: Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    # Doc-only pushes don't change the image — skip the build + redeploy.
    # paths-ignore only skips when ALL changed files match, so a mixed
    # code+docs push still builds; release tags build on their code commit.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mint App token for gitops push
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.MERLINLABS_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.MERLINLABS_AUTOMATION_PRIVATE_KEY }}
          owner: RyanMerlin
          repositories: |
            edgeplane
            gitops-merlinlabs

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ghcr.io/ryanmerlin/edgeplane
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push edgeplane
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: crates/edgeplane-tower/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edgeplane
          cache-to: type=gha,mode=max,scope=edgeplane

      - name: Update gitops image tag
        if: ${{ github.ref_type == 'branch' }}
        run: |
          SHORT_SHA=${{ steps.sha.outputs.short }}
          # docker/metadata-action `type=sha` publishes `:sha-<short>` (default prefix).
          # The gitops manifest must match that exact tag — bare `:<short>`
          # produces an ImagePullBackOff.
          IMAGE_TAG="sha-${SHORT_SHA}"
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/RyanMerlin/gitops-merlinlabs.git /tmp/gitops
          cd /tmp/gitops
          DEPLOY=merlinlabs/applications/edgeplane/edgeplane-tower-deployment.yaml
          sed -i "s|ghcr.io/ryanmerlin/edgeplane:[a-zA-Z0-9._-]*|ghcr.io/ryanmerlin/edgeplane:${IMAGE_TAG}|g" "$DEPLOY"
          git config user.email "ci@ryanmerlin.dev"
          git config user.name "MC CI"
          git add "$DEPLOY"
          git diff --staged --quiet || git commit -m "chore(deploy): bump edgeplane-tower to ${IMAGE_TAG}"
          git push
