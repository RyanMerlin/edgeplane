id: auth
title: Authentication and session model
status: partial
maturity: beta
owners:
  - platform
summary: >
  Supports OIDC, service-account tokens, and node JWTs.
  OIDC uses PKCE browser flow with one-time exchange into an mcs session token.
  Node JWTs (RS256) are issued at registration and proactively rotated at 60 days.

source_of_truth:
  docs:
    - README.md
    - docs/guides/OIDC.md
    - docs/guides/DEPLOYMENT.md
  code_paths:
    - crates/edgeplane-tower/src/auth.rs
    - crates/edgeplane-tower/src/routes/auth.rs

entrypoints:
  run:
    - command: bash scripts/dev-up.sh
      purpose: Start local stack with default token auth
  verify:
    - command: curl http://localhost:8008/healthz
      purpose: Liveness check
    - command: curl http://localhost:8008/readyz
      purpose: Readiness check

interfaces:
  env_vars:
    - AUTH_MODE          # oidc | dual
    - OIDC_REQUIRED      # true | false
    - EP_JWT_SIGNING_KEY # base64-encoded PKCS#8 RSA PEM for node JWT signing
    - OIDC_ISSUER_URL    # OIDC provider URL
    - OIDC_CLIENT_ID
    - OIDC_CLIENT_SECRET
  endpoints:
    - /auth/oidc/start
    - /auth/oidc/callback
    - /auth/oidc/exchange
    - /mcp/health

implemented:
  - token auth mode
  - oidc auth mode (PKCE browser flow)
  - dual auth mode (token + oidc both accepted)
  - one-time code exchange into mcs session token
  - actor_subject_from_request extraction (email or OIDC subject)
  - platform admin via service-token

gaps:
  - auth failure mode matrix not centrally documented
  - local agent auth vs browser auth boundaries need a single authoritative summary

todos:
  - add auth sequence diagram
  - document service-account auth future state

dependencies:
  - api

read_next:
  - docs/guides/OIDC.md
  - docs/guides/DEPLOYMENT.md

last_reviewed: 2026-03-21
confidence: medium
