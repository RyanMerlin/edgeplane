[workspace]
resolver = "2"

[workspace.package]
version = "0.15.5"
edition = "2024"
authors = ["MissionControl Engineers <support@missioncontrol.ai>"]
license = "Apache-2.0"

[package]
name = "mc-controlplane"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "MissionControl server node — HTTP API + distributed task coordination"
license.workspace = true

[[bin]]
name = "mc-controlplane"
path = "src/main.rs"

[lib]
name = "mc_controlplane"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1.34", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
dirs = "4"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1.0"
tar = "0.4"
tokio-stream = "0.1"
futures-util = "0.3"
tempfile = "3.9"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
rust-s3 = { version = "0.35", default-features = false, features = ["with-tokio", "tokio-rustls-tls", "fail-on-err"] }

[dev-dependencies]
axum-test = "20"
wiremock = "0.6"
