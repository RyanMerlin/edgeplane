services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: edgeplane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edgeplane
      POSTGRES_USER: edgeplane
      POSTGRES_PASSWORD: edgeplane
    volumes:
      - edgeplane-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeplane -d edgeplane || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  rustfs:
    image: rustfs/rustfs:latest
    container_name: edgeplane-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: edgeplane
      RUSTFS_SECRET_KEY: edgeplane-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - edgeplane-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/health/live || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"403\" ]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  rustfs-init:
    build:
      context: .
      dockerfile: crates/edgeplane-tower/Dockerfile
    container_name: edgeplane-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      EP_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      EP_OBJECT_STORAGE_REGION: us-east-1
      EP_OBJECT_STORAGE_BUCKET: edgeplane
      EP_OBJECT_STORAGE_ACCESS_KEY: edgeplane
      EP_OBJECT_STORAGE_ACCESS_SECRET: edgeplane-secret
    entrypoint: ["edgeplane-tower", "bucket-init"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: crates/edgeplane-tower/Dockerfile
    container_name: edgeplane-api
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://edgeplane:edgeplane@postgres:5432/edgeplane
      EP_TOKEN: ${EP_TOKEN:-}
      EP_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      EP_OBJECT_STORAGE_REGION: us-east-1
      EP_OBJECT_STORAGE_BUCKET: edgeplane
      EP_OBJECT_STORAGE_SECURE: "false"
      EP_OBJECT_STORAGE_ACCESS_KEY: edgeplane
      EP_OBJECT_STORAGE_ACCESS_SECRET: edgeplane-secret
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    mem_limit: 1g
    cpus: 1.5

  mcpd:
    build:
      context: .
      dockerfile: crates/edgeplane/Dockerfile
    container_name: edgeplane-mcpd
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      EP_MCP_MODE: daemon
      EP_BASE_URL: http://api:8008
      EP_DAEMON_HOST: 0.0.0.0
      EP_DAEMON_PORT: "8765"
      EP_TOKEN: ${EP_TOKEN:-}
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 256m
    cpus: 1.0

volumes:
  edgeplane-postgres-data:
  edgeplane-rustfs-data:
