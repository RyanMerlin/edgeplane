[package]
name = "edgeplane"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust-native MCP bridge for Edgeplane"
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.5"
clap-markdown = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.34", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.4"
urlencoding = "2.1"
futures-util = "0.3"
axum = { version = "0.8", features = ["macros"] }
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
hyper = "1.8.1"
wasmtime = "45"
wat = "1.0"
dirs = "4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
open = "5"
base64 = "0.22"
tar = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
portable-pty = "0.8"
which = "6"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
edgeplaned-paths = { path = "../edgeplaned-paths" }
edgeplaned-packs = { path = "../edgeplaned/crates/edgeplaned-packs" }
edgeplaned-receipts = { path = "../edgeplaned/crates/edgeplaned-receipts" }
edgeplaned-sync = { path = "../edgeplaned/crates/edgeplaned-sync" }
edgeplaned-secrets = { path = "../edgeplaned/crates/edgeplaned-secrets" }
ratatui = "0.29"
crossterm = "0.28"
async-trait = "0.1"

[dev-dependencies]
httpmock = "0.6"
wasmtime = "45"
wat = "1.0"
tempfile = "3.9"
wiremock = "0.6"
