services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: missioncontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missioncontrol}
      POSTGRES_USER: ${POSTGRES_USER:-missioncontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - missioncontrol-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missioncontrol} -d ${POSTGRES_DB:-missioncontrol} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: missioncontrol-mosquitto
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-missioncontrol}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD}
    ports:
      - "1884:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ${MQTT_PASSWORD_FILE:-./docker/mosquitto/passwords/passwords}:/mosquitto/config/passwords/passwords:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -C 1 -t '$$SYS/broker/version' -i healthcheck -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  rustfs:
    image: rustfs/rustfs:latest
    container_name: missioncontrol-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MC_OBJECT_STORAGE_ACCESS_KEY:?set MC_OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MC_OBJECT_STORAGE_ACCESS_SECRET:?set MC_OBJECT_STORAGE_ACCESS_SECRET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - missioncontrol-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/health/live || true); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"403\" ]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: 1.5

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: missioncontrol-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MC_OBJECT_STORAGE_ACCESS_KEY:?set MC_OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MC_OBJECT_STORAGE_ACCESS_SECRET:?set MC_OBJECT_STORAGE_ACCESS_SECRET}
      AWS_DEFAULT_REGION: ${MC_OBJECT_STORAGE_REGION:-us-east-1}
      MC_ENDPOINT: http://rustfs:9000
      MC_BUCKET: ${MC_OBJECT_STORAGE_BUCKET:-missioncontrol}
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url $$MC_ENDPOINT s3api head-bucket --bucket $$MC_BUCKET 2>/dev/null \
          && echo "bucket exists: $$MC_BUCKET" \
          || (aws --endpoint-url $$MC_ENDPOINT s3api create-bucket --bucket $$MC_BUCKET \
              && echo "bucket created: $$MC_BUCKET")
    restart: "no"

  opencode:
    # AI coding agent — drives inference for the AI Console runtime layer.
    # Runs opencode in HTTP server mode; OpencodeAdapter connects to it at
    # MC_OPENCODE_URL (default: http://opencode:4096).
    build:
      context: .
      dockerfile: docker/opencode/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.2.26}
    container_name: missioncontrol-opencode
    profiles:
      - opencode
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-missioncontrol}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Inject config without needing a persistent config file.
      # OPENCODE_MODEL overrides the active model; OPENCODE_PROVIDER_* sets provider options.
      # For a custom OpenAI-compatible endpoint set OPENAI_API_BASE and OPENCODE_MODEL.
      OPENCODE_CONFIG_CONTENT: ${OPENCODE_CONFIG_CONTENT:-}
    ports:
      - "4096:4096"
    volumes:
      - missioncontrol-opencode-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4096/global/health 2>/dev/null | grep -q '\"healthy\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0

  api:
    build:
      context: .
      dockerfile: integrations/mc-controlplane/Dockerfile
    container_name: missioncontrol-api
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-missioncontrol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-missioncontrol}
      MC_OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      MC_OBJECT_STORAGE_REGION: us-east-1
      MC_OBJECT_STORAGE_BUCKET: ${MC_OBJECT_STORAGE_BUCKET:-missioncontrol}
      MC_OBJECT_STORAGE_SECURE: "false"
      MC_OBJECT_STORAGE_ACCESS_KEY: ${MC_OBJECT_STORAGE_ACCESS_KEY}
      MC_OBJECT_STORAGE_ACCESS_SECRET: ${MC_OBJECT_STORAGE_ACCESS_SECRET}
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    mem_limit: 2g
    cpus: 2.0

  mcpd:
    build:
      context: .
      dockerfile: integrations/mc/Dockerfile
    container_name: missioncontrol-mcpd
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MC_MCP_MODE: daemon
      MC_BASE_URL: http://api:8008
      MC_DAEMON_HOST: 0.0.0.0
      MC_DAEMON_PORT: "8765"
      MC_TOKEN: ${MC_TOKEN:-}
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

volumes:
  missioncontrol-postgres-data:
  missioncontrol-rustfs-data:
  missioncontrol-opencode-workspace:
