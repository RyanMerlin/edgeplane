name: Cloud Infra

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      apply:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4
        with:
          terraform_version: 1.5.7
      - name: Configure Azure Credentials
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5
        with:
          version: v3.12.0
      - name: Terraform Init
        working-directory: infra/terraform/environments/azure
        run: terraform init
      - name: Terraform Plan
        working-directory: infra/terraform/environments/azure
        run: terraform plan -input=false
      - name: Terraform Apply
        if: ${{ inputs.apply }}
        working-directory: infra/terraform/environments/azure
        run: terraform apply -auto-approve
      - name: Export Kubeconfig
        if: ${{ inputs.apply }}
        run: |
          pushd infra/terraform/environments/azure
          terraform output -raw kube_admin_config_raw > /tmp/kubeconfig
          terraform output -raw resource_group_name > /tmp/ep_rg
          terraform output -raw postgres_hostname > /tmp/postgres_host
          popd
          mkdir -p ~/.kube
          mv /tmp/kubeconfig ~/.kube/azure_kubeconfig
      - name: Deploy EdgePlane
        if: ${{ inputs.apply }}
        run: |
          RESOURCE_GROUP=$(cat /tmp/ep_rg)
          az aks get-credentials --name edgeplane-aks --resource-group "$RESOURCE_GROUP" --file ~/.kube/azure_kubeconfig --overwrite-existing
          export KUBECONFIG=~/.kube/azure_kubeconfig
          POSTGRES_HOST=$(cat /tmp/postgres_host)
          cat > /tmp/ep-secrets.yaml <<EOF
          secrets:
            POSTGRES_PASSWORD: "${{ secrets.POSTGRES_PASSWORD }}"
          EOF
          helm upgrade --install edgeplane infra/helm/edgeplane \
            --values infra/helm/edgeplane/values.yaml \
            --values /tmp/ep-secrets.yaml \
            --set config.POSTGRES_HOST="$POSTGRES_HOST" \
            --namespace edgeplane --create-namespace
          rm -f /tmp/ep-secrets.yaml
      - name: Smoke Tests
        if: ${{ inputs.apply }}
        run: |
          export KUBECONFIG=~/.kube/azure_kubeconfig
          kubectl run edgeplane-smoke --image=busybox --restart=Never --rm -- sh -c "wget -qO- http://edgeplane-api/healthz"
