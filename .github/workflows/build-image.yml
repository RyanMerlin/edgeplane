name: Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mint App token for gitops push
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MERLINLABS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.MERLINLABS_AUTOMATION_PRIVATE_KEY }}
          owner: RyanMerlin
          repositories: |
            missioncontrol
            gitops-merlinlabs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ryanmerlin/missioncontrol
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push missioncontrol
        uses: docker/build-push-action@v7
        with:
          context: .
          file: integrations/mc-controlplane/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=missioncontrol
          cache-to: type=gha,mode=max,scope=missioncontrol

      - name: Update gitops image tag
        if: ${{ github.ref_type == 'branch' }}
        run: |
          SHORT_SHA=${{ steps.sha.outputs.short }}
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/RyanMerlin/gitops-merlinlabs.git /tmp/gitops
          cd /tmp/gitops
          DEPLOY=merlinlabs/applications/missioncontrol/mc-controlplane-deployment.yaml
          sed -i "s|ghcr.io/ryanmerlin/missioncontrol:[a-zA-Z0-9._-]*|ghcr.io/ryanmerlin/missioncontrol:${SHORT_SHA}|g" "$DEPLOY"
          git config user.email "ci@ryanmerlin.dev"
          git config user.name "MC CI"
          git add "$DEPLOY"
          git diff --staged --quiet || git commit -m "chore(deploy): bump mc-controlplane to ${SHORT_SHA}"
          git push
