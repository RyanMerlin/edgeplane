<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edgeplane — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #0d1117; color: #e6edf3;
  font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono',ui-monospace,monospace;
  font-size: 13px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
.ok { color: #3fb950; } .warn { color: #d29922; } .err { color: #f85149; }
.accent { color: #58a6ff; } .dim { color: #484f58; } .muted { color: #8b949e; }

/* subtle grid — just barely visible, not the aggressive current version */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
}

#page { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }

.login-card {
  width: 380px;
  background: #161b22;
  border: 1px solid #30363d;
}

.card-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid #21262d;
  display: flex; align-items: center; gap: 12px;
}
.card-logo {
  font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: -0.03em; line-height: 1;
}
.card-logo-sub {
  font-size: 12px; color: #8b949e; margin-top: 3px;
}
.card-status {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: #484f58;
}

.card-body { padding: 20px 24px; }

.card-section { margin-bottom: 20px; }
.card-section + .card-section { padding-top: 16px; border-top: 1px solid #21262d; }

.section-lbl {
  font-size: 10px; color: #484f58; text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 10px; display: block;
}

.oidc-desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; line-height: 1.6; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 7px 12px; border-radius: 3px;
  border: 1px solid; font-family: inherit; font-size: 12px; cursor: pointer;
}
.btn.primary { border-color: #238636; color: #3fb950; background: #0d2b1a; }
.btn.primary:hover { border-color: #3fb950; background: #0f3520; }
.btn.ghost { border-color: #30363d; color: #8b949e; background: #161b22; }
.btn.ghost:hover { border-color: #8b949e; color: #e6edf3; }

.input-row { margin-bottom: 8px; }
.input-lbl { font-size: 11px; color: #484f58; display: block; margin-bottom: 5px; }
.input {
  width: 100%; background: #0d1117; border: 1px solid #30363d;
  border-radius: 3px; padding: 6px 8px; color: #e6edf3;
  font-family: inherit; font-size: 12px; outline: none;
}
.input:focus { border-color: #58a6ff; }
.input::placeholder { color: #484f58; }

.token-send { margin-top: 8px; }

.card-foot {
  padding: 10px 24px;
  border-top: 1px solid #21262d;
  background: #0d1117;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: #484f58;
}
.foot-badges { display: flex; gap: 10px; }
.foot-badge { display: flex; align-items: center; gap: 4px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
</style>
</head>
<body>

<div id="page">
  <div class="login-card">

    <div class="card-head">
      <div>
        <div class="card-logo">edgeplane</div>
        <div class="card-logo-sub">edgeplane</div>
      </div>
      <div class="card-status">
        <span class="ok">●</span>
        <span>v0.4.2</span>
        <span class="dim">·</span>
        <span style="color:#484f58">edgeplane:8008</span>
      </div>
    </div>

    <div class="card-body">

      <div class="card-section">
        <span class="section-lbl">Production Login</span>
        <p class="oidc-desc">Authenticate via your organization's identity provider. All sessions are CSRF-protected and expire after inactivity.</p>
        <button class="btn primary">
          <span>⬡</span>
          Sign in with OIDC
        </button>
      </div>

      <div class="card-section">
        <span class="section-lbl">Development Token</span>
        <div class="input-row">
          <label class="input-lbl">EP_AGENT_TOKEN</label>
          <input class="input" type="password" placeholder="Enter bearer token..." />
        </div>
        <button class="btn ghost token-send">Continue with token</button>
      </div>

    </div>

    <div class="card-foot">
      <div class="foot-badges">
        <span class="foot-badge"><span class="ok">✓</span> TLS</span>
        <span class="foot-badge"><span class="ok">✓</span> CSRF</span>
        <span class="foot-badge"><span class="ok">✓</span> Cookie</span>
      </div>
      <span style="color:#30363d">Secure session · httpOnly</span>
    </div>

  </div>
</div>

</body>
</html>
