# mc-controlplane local dev stack — Postgres + mc-controlplane + web
#
# DEV ONLY — DO NOT use these defaults in production.
# Hardcoded passwords (POSTGRES_PASSWORD, MC_TOKEN) are public values
# baked into a checked-in compose file; any deployment reachable from
# the internet that uses this file is open. Production deployments
# must source credentials from a secret manager. See SECURITY.md.
#
# Usage:
#   docker compose -f docker-compose.mc-dev.yml up --build
#
# Ports:
#   5173 — SvelteKit dev server (proxies API calls to mc-controlplane)
#   8008 — mc-controlplane API
#   5432 — Postgres (exposed for psql / pgAdmin)
#
# Quick test:
#   curl http://localhost:8008/health
#   open http://localhost:5173/

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: missioncontrol-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: missioncontrol
      POSTGRES_USER: missioncontrol
      POSTGRES_PASSWORD: missioncontrol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missioncontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  mc-controlplane:
    build:
      context: .
      dockerfile: crates/mc-controlplane/Dockerfile
    container_name: missioncontrol-mc-controlplane-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://missioncontrol:missioncontrol@postgres:5432/missioncontrol
      MC_BIND: 0.0.0.0:8008
      MC_TOKEN: dev-token
      RUST_LOG: mc_controlplane=debug,info
    ports:
      - "8008:8008"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: node:24-alpine
    container_name: missioncontrol-web-dev
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      MC_DEV_API: http://mc-controlplane:8008
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      mc-controlplane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web-node-modules:
