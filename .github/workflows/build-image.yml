name: Build and Push Image

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.MC_GIT_PUBLISH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push missioncontrol
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/ryanmerlin/missioncontrol:${{ steps.sha.outputs.short }}
            ghcr.io/ryanmerlin/missioncontrol:latest
          cache-from: type=gha,scope=missioncontrol
          cache-to: type=gha,mode=max,scope=missioncontrol

      - name: Update gitops image tag
        run: |
          SHORT_SHA=${{ steps.sha.outputs.short }}
          git clone https://x-access-token:${{ secrets.MC_GIT_PUBLISH_TOKEN }}@github.com/RyanMerlin/gitops-merlinlabs.git /tmp/gitops
          cd /tmp/gitops
          DEPLOY=merlinlabs/applications/missioncontrol/mc-server-deployment.yaml
          sed -i "s|ghcr.io/ryanmerlin/missioncontrol:[a-zA-Z0-9._-]*|ghcr.io/ryanmerlin/missioncontrol:${SHORT_SHA}|g" "$DEPLOY"
          git config user.email "ci@ryanmerlin.dev"
          git config user.name "MC CI"
          git add "$DEPLOY"
          git diff --staged --quiet || git commit -m "chore(deploy): bump mc-server to ${SHORT_SHA}"
          git push
