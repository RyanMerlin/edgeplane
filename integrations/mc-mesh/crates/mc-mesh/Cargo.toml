[package]
name = "mc-mesh"
version.workspace = true
edition = "2024"
description = "mc-mesh daemon — work-first agent coordination for MissionControl"
license = "Apache-2.0"

[[bin]]
name = "mc-mesh"
path = "src/main.rs"

[dependencies]
mc-mesh-acp = { path = "../mc-mesh-acp" }
mc-mesh-core = { path = "../mc-mesh-core" }
mc-mesh-secrets = { path = "../mc-mesh-secrets" }
mc-mesh-packs = { path = "../mc-mesh-packs" }
mc-mesh-receipts = { path = "../mc-mesh-receipts" }
mc-mesh-work = { path = "../mc-mesh-work" }
mc-mesh-runtimes = { path = "../mc-mesh-runtimes" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
http = "1"

[dev-dependencies]
tempfile = "3.9"
