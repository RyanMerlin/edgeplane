id: mc-rust
title: Rust mc CLI and daemon
status: active
maturity: beta
owners:
  - platform
summary: >
  Rust-native local agent gateway. The mc binary connects agents to MissionControl
  via MCP tool calls, manages the local daemon for SSE stream fan-out, and provides
  profile management. Canonical entry point for Codex, Claude Code, and Gemini agents.

source_of_truth:
  docs:
    - docs/reference/COMMAND-MAP.md
    - docs/reference/MC-RUST.md
    - docs/reference/REAL-TIME.md
    - README.md
  code_paths:
    - distribution/

entrypoints:
  run:
    - command: mc daemon
      purpose: Start local mc daemon (SSE fan-out, tool dispatch)
    - command: mc run claude
      purpose: Launch Claude Code in a prepared profile runtime
    - command: mc run codex
      purpose: Launch Codex in a prepared profile runtime
    - command: mc run gemini
      purpose: Launch Gemini in a prepared profile runtime
  agent_ops:
    - command: mc agent signal <id> --content "..."
      purpose: Send a prompt to an agent. Auto-resolves local (mcd) vs controlplane.
    - command: mc agent cancel <id>
      purpose: Interrupt the agent (Ctrl c for ZellijHosted).
    - command: mc agent list [--source local|remote|all]
      purpose: Enumerate visible agents tagged by source.
    - command: mc agent describe <id>
      purpose: Show one agent's runtime, session, vault folder, supervision state.
    - command: mc agent attach <id> [--web]
      purpose: Attach to a live agent. ZellijHosted execs zellij attach (or prints web URL with --web). ACP streams via WebSocket.
  verify:
    - command: mc system doctor
      purpose: Health check (backend connectivity, token, daemon)
    - command: mcd doctor
      purpose: Read-only mcd health check — lock state, port reachability, registry, runtime resolution.

interfaces:
  env_vars:
    - MC_BASE_URL        # MissionControl backend URL
    - MC_TOKEN           # Agent bearer token
    - MC_AGENT_ID        # Agent identity
    - MC_SCHEMA_PACK_FILE  # Optional schema pack override
  commands:
    - mc auth login
    - mc auth whoami
    - mc auth logout
    - mc daemon
    - mc launch <agent>   # openclaw/custom legacy launch surface
    - mc data tools list
    - mc data tools call <tool> <args>
    - mc data sync status
    - mc data explorer tree
    - mc admin policy active
    - mc admin governance
    - mc system doctor
    - mc system update self-update
    - mc system compat matrix run
    - mc system drift triage
    - mc agent remote sessions list
    - mc agent evolve status --mission <id>
    - mc agent node register
    - mc agent node run
    - mc agent node doctor
    - mc run claude [-p profile] [--mission id] [--mode interactive|headless|solo]
    - mc run codex [-p profile] [--mission id] [--mode interactive|headless|solo]
    - mc run gemini [-p profile]
    - mc run claude doctor [-p profile] --fix
    - mc run claude exec [-p profile] -- [args]
    - mc run codex doctor [-p profile] --fix
    - mc run codex status [-p profile]
    - mc run codex exec [-p profile] -- [args]
    - mc profile list
    - mc profile use <name>
    - mc profile show <name>
    - mc profile activate <name>
    - mc profile create <name>
    - mc profile publish <name>
    - mc profile pull <name>
    - mc profile download <name>
    - mc profile pin <name> <sha256>
    - mc profile status <name>
    - mc profile delete <name>

implemented:
  - MCP tool dispatch over HTTP
  - SSE stream fan-out via daemon
  - agent launch with proper startup layering
  - profile management (list/use/push/pull/delete)
  - atomic symlink swap for profile activation (~/.missioncontrol/profiles/active)
  - mc system doctor health diagnostics
  - env file loading on mc launch (legacy launch surface)

gaps:
  - mc binary not checked into repo (installed separately via scripts/install-mc.sh)
  - daemon restart behavior on backend disconnect not fully documented

todos:
  - document daemon resilience and reconnect behavior

dependencies:
  - api
  - auth

read_next:
  - docs/reference/COMMAND-MAP.md
  - docs/reference/MC-RUST.md
  - docs/reference/REAL-TIME.md
  - docs/guides/DEPLOYMENT.md

last_reviewed: 2026-04-12
confidence: high
